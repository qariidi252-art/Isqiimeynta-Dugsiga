<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maamulka — Qiimeynta Macallimiinta</title>
<style>
  :root {
    --bg:#f2f4f8; --surface:#fff; --surface-2:#eef1f6; --text:#1a2035; --text-dim:#5b6478;
    --border:#dde2ec; --navy:#0d1b5e; --navy-dark:#081142; --gold:#f2b705; --accent:#2f7fd1;
    --good:#1e8e5a; --warn:#c98a13; --bad:#c0392b;
    --shadow:0 1px 3px rgba(13,27,94,.10),0 1px 2px rgba(13,27,94,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1320; --surface:#161b2c; --surface-2:#1d2338; --text:#e7ebf5; --text-dim:#8f97b3;
      --border:#2a3150; --navy:#3550c9; --navy-dark:#1a2560; --gold:#f2c94c; --accent:#5b9fe0;
      --good:#3fae7a; --warn:#e0ac3f; --bad:#e0685b;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; }
  header { padding:16px; background:linear-gradient(135deg,var(--navy-dark),var(--navy)); color:#fff; display:flex; align-items:center; gap:12px; }
  header img.logo { width:46px; height:46px; border-radius:50%; object-fit:cover; box-shadow:0 0 0 2px var(--gold); flex-shrink:0; }
  header .htext h1 { margin:0 0 2px; font-size:1.05rem; }
  header .htext p { margin:0; font-size:.75rem; opacity:.85; }
  nav.tabs { display:flex; gap:6px; overflow-x:auto; padding:10px 12px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  nav.tabs button { flex:0 0 auto; border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:8px 14px; border-radius:20px; font-size:.85rem; font-weight:600; cursor:pointer; }
  nav.tabs button.active { background:var(--navy); border-color:var(--navy); color:#fff; }
  main { padding:14px; max-width:760px; margin:0 auto; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 12px; font-size:1rem; color:var(--navy); }
  @media (prefers-color-scheme: dark) { .card h2 { color:var(--gold); } }
  .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center; box-shadow:var(--shadow); }
  .stat .num { font-size:1.6rem; font-weight:800; color:var(--navy); }
  @media (prefers-color-scheme: dark) { .stat .num { color:var(--gold); } }
  .stat .lbl { font-size:.75rem; color:var(--text-dim); }
  label { display:block; font-size:.8rem; font-weight:600; color:var(--text-dim); margin:10px 0 4px; }
  input[type=text],input[type=password],input[type=date],select,textarea {
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:.95rem; font-family:inherit;
  }
  textarea { resize:vertical; min-height:60px; }
  .btn { display:inline-block; background:var(--navy); color:#fff; border:none; padding:11px 18px; border-radius:10px; font-weight:700; font-size:.9rem; cursor:pointer; margin-top:12px; }
  .btn.gold { background:var(--gold); color:#1a1a1a; }
  .btn.secondary { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn:disabled { opacity:.5; }
  .teacher-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--border); }
  .teacher-row:last-child { border-bottom:none; }
  .teacher-row .name { font-weight:700; cursor:pointer; }
  .teacher-row .sub { font-size:.78rem; color:var(--text-dim); }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:.75rem; font-weight:700; color:#fff; }
  .badge.good { background:var(--good); } .badge.warn { background:var(--warn); } .badge.bad { background:var(--bad); } .badge.neutral { background:var(--text-dim); }
  .empty { text-align:center; padding:28px 10px; color:var(--text-dim); font-size:.9rem; }
  .backbtn { background:none; border:none; color:var(--accent); font-weight:700; font-size:.85rem; padding:0 0 10px; cursor:pointer; }
  .eval-item { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--surface-2); }
  .eval-item .row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .notes-txt { font-size:.82rem; color:var(--text-dim); margin-top:6px; white-space:pre-wrap; }
  .chart-wrap { position:relative; height:200px; margin-top:8px; }
  .compare-note { font-size:.8rem; padding:10px 12px; border-radius:10px; margin-top:10px; }
  .compare-note.ok { background:rgba(30,142,90,.12); color:var(--good); }
  .compare-note.pending { background:rgba(201,138,19,.12); color:var(--warn); }
  .del-x { background:none; border:none; color:var(--bad); font-size:1.1rem; cursor:pointer; padding:2px 6px; }
  .loading { text-align:center; padding:40px; color:var(--text-dim); }
  .link-box { display:flex; gap:6px; align-items:center; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin-top:8px; font-size:.78rem; word-break:break-all; }
  .link-box button { flex:0 0 auto; }
  #loginScreen { max-width:340px; margin:60px auto; text-align:center; }
  #loginScreen img.logo { width:70px; height:70px; border-radius:50%; box-shadow:0 0 0 3px var(--gold); margin-bottom:8px; }

  .scale-legend { font-size:.72rem; color:var(--text-dim); line-height:1.6; background:var(--surface-2); border-radius:10px; padding:10px 12px; margin-top:6px; }
  .qitem { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--surface); }
  .qitem-title { font-weight:700; font-size:.85rem; margin-bottom:2px; }
  .qitem-text { font-size:.8rem; color:var(--text-dim); margin-bottom:8px; line-height:1.4; }
  .rate-row { display:flex; gap:5px; margin-bottom:6px; }
  .rate-btn { flex:1; padding:9px 2px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:.85rem; font-weight:800; cursor:pointer; text-align:center; }
  .rate-btn[data-r="5"].sel { background:var(--good); border-color:var(--good); color:#fff; }
  .rate-btn[data-r="4"].sel { background:#5aa96d; border-color:#5aa96d; color:#fff; }
  .rate-btn[data-r="3"].sel { background:var(--warn); border-color:var(--warn); color:#fff; }
  .rate-btn[data-r="2"].sel { background:#d98a4c; border-color:#d98a4c; color:#fff; }
  .rate-btn[data-r="1"].sel { background:var(--bad); border-color:var(--bad); color:#fff; }
  .qitem-comment { width:100%; padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); font-size:.8rem; }
  .progress-bar-wrap { background:var(--surface-2); border-radius:20px; height:8px; overflow:hidden; margin:8px 0 4px; }
  .progress-bar { background:var(--navy); height:100%; transition:width .2s; }

  details { margin-top:8px; }
  summary { font-size:.8rem; color:var(--accent); cursor:pointer; font-weight:600; }
  .cmp-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:.8rem; gap:8px; }
  .cmp-row:last-child { border-bottom:none; }
  .cmp-title { flex:1; }
  .cmp-vals { display:flex; align-items:center; gap:6px; font-weight:800; white-space:nowrap; }
  .cmp-up { color:var(--good); } .cmp-down { color:var(--bad); } .cmp-same { color:var(--text-dim); }
  .cmp-summary { font-size:.82rem; padding:10px 12px; border-radius:10px; margin-bottom:8px; background:var(--surface-2); }

  .subview-tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .subview-tabs button { flex:1 1 auto; border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:9px 10px; border-radius:10px; font-size:.82rem; font-weight:700; cursor:pointer; }
  .subview-tabs button.active { background:var(--navy); border-color:var(--navy); color:#fff; }
  .subj-chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:9px 12px; border-radius:10px; font-size:.82rem; font-weight:600; cursor:pointer; margin:0 6px 8px 0; }
  .subj-chip.sel { background:var(--good); border-color:var(--good); color:#fff; }
  .subj-grid { display:flex; flex-wrap:wrap; }
  .student-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .student-row:last-child { border-bottom:none; }
  .student-row .name { font-weight:700; }
  .student-row .sub { font-size:.78rem; color:var(--text-dim); }
  #reportArea { background:#fff; color:#111; border-radius:14px; padding:20px; box-shadow:var(--shadow); }
  #reportArea table.subj-table th, #reportArea table.subj-table td { text-align:center; font-size:.72rem; padding:4px 5px; }
  #reportArea table.subj-table td.namecell, #reportArea table.subj-table th.namecell { text-align:left; }
  #reportArea .yes { color:#1e8e5a; font-weight:800; }
  #reportArea .no { color:#c0392b; font-weight:800; }
  #reportArea h2, #reportArea h3 { color:#0d1b5e; }
  #reportArea table { width:100%; border-collapse:collapse; font-size:.82rem; margin-top:8px; }
  #reportArea th, #reportArea td { border:1px solid #ccc; padding:6px 8px; text-align:left; }
  #reportArea th { background:#eef1f6; }
  .report-header { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .report-header img { width:60px; height:60px; border-radius:50%; }
  @media print {
    nav.tabs, .no-print, header { display:none !important; }
    body { background:#fff; }
    main { max-width:100%; padding:0; }
    #reportArea { box-shadow:none; border:none; }
  }
</style>
</head>
<body>
<div id="jsErrorBox" style="display:none;background:#c0392b;color:#fff;padding:14px;font-size:.78rem;white-space:pre-wrap;font-family:monospace;"></div>
<script>
  window.addEventListener('error', function(e){
    var box = document.getElementById('jsErrorBox');
    if (box) {
      box.style.display = 'block';
      box.textContent = '⚠️ JS ERROR: ' + e.message + '\nLine: ' + e.lineno + ', Col: ' + e.colno + '\nFile: ' + (e.filename||'inline');
    }
  });
</script>
<header>
  <img class="logo" src="/logo.jpg" alt="Dugsiga Howlwadaag Sare">
  <div class="htext">
    <h1>Dugsiga Howlwadaag Sare</h1>
    <p>Maamulka — Qiimeynta Macallimiinta</p>
  </div>
</header>

<div id="loginScreen" style="display:none;">
  <div class="card" style="text-align:center;">
    <img class="logo" src="/logo.jpg" alt="logo">
    <h2>Gal Maamulka</h2>
    <label>Sirta (Password)</label>
    <input type="password" id="pwInput" placeholder="Geli sirta">
    <button class="btn" id="loginBtn" style="width:100%;">Gal</button>
    <p id="loginErr" style="color:var(--bad);font-size:.8rem;"></p>
  </div>
</div>

<div id="appShell" style="display:none;">
  <nav class="tabs">
    <button data-tab="dashboard" class="active">Guddiga Guud</button>
    <button data-tab="teachers">Macallimiinta</button>
    <button data-tab="students">Ardayda</button>
    <button data-tab="sow">📘 Scheme of Work</button>
    <button data-tab="newEval">Qiimeyn Cusub</button>
    <button data-tab="reports">Warbixin</button>
    <button id="logoutBtn" style="background:transparent;border:1px solid var(--bad);color:var(--bad);">⏻ Ka Bax</button>
  </nav>
  <main id="app"><div class="loading">Soo dejinaya...</div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- Official 10-item evaluation form ----------
  const CRITERIA = [
    { key:"prep", title:"1. Cashar-diyaarinta", text:"Macallinku ma haystaa cashar-diyaarin dhammaystiran oo ansax ah?" },
    { key:"scheme", title:"2. Isla Socodka Scheme of Work iyo Cashar-diyaarinta", text:"Ma isla socdaan Scheme of Work-ka iyo Cashar-diyaarinta, oo casharka la dhigayo ma waafaqsan yahay qorshaha?" },
    { key:"agabka", title:"3. Agabka Waxbarashada", text:"Macallinku ma haystaa oo si habboon ma u isticmaalaa agabka looga baahan yahay casharka?" },
    { key:"habka", title:"4. Habka Wax-dhigidda", text:"Macallinku ma adeegsadaa habab wax-dhigid oo ku habboon da'da iyo kartida ardayda?" },
    { key:"fahamka", title:"5. Hubinta Fahamka Ardayda", text:"Macallinku ma hubiyaa fahamka ardayda inta casharku socdo?" },
    { key:"fasalka", title:"6. Maareynta Fasalka", text:"Macallinku ma si wanaagsan ayuu u maareeyaa fasalka, una ilaaliyaa nidaamka iyo anshaxa ardayda?" },
    { key:"qaybgal", title:"7. Ka-qaybgalka Ardayda", text:"Macallinku ma dhiirrigeliyaa oo ma ka qaybgelinayaa ardayda casharka?" },
    { key:"ixtiraam", title:"8. Xiriirka iyo Ixtiraamka Ardayda", text:"Macallinku ma ixtiraamaa ardayda, qof walbana ma siiyaa fursad siman?" },
    { key:"qiimeyn", title:"9. Qiimeynta Ardayda", text:"Macallinku ma qiimeeyaa aqoonta, xirfadaha iyo fahamka ardayda?" },
    { key:"jawaab", title:"10. Jawaab-celinta Ardayda", text:"Macallinku ma siiyaa ardayda jawaab-celin iyo talooyin ka caawiya horumarkooda?" }
  ];
  const TOTAL_ITEMS = CRITERIA.length;

  // Subjects are managed dynamically from the server (see "Maadooyinka" subview)
  let subjectCatalog = []; // [{key, title}]

  let teachers = [];
  let evaluations = [];
  let students = [];
  let currentTeacherId = null;
  let activeTab = "dashboard";
  let preselectTeacher = null;
  let chartInstance = null;
  let evalState = {};

  // ---------- Students tab state ----------
  let studentView = "assign"; // assign | report | manage | subjects
  let assignStudentId = null;
  let assignSelected = [];
  let reportClass = null;
  let reportSection = "__ALL__";
  let completeReportClass = "__ALL__";
  let completeReportSection = "__ALL__";
  let studentSearchQuery = "";

  // ---------- Scheme of Work state ----------
  let sowTopics = [];
  let sowSettings = {};
  let sowView = "progress"; // progress | upload | settings
  let sowSubject = null;
  let sowClass = null;

  const app = document.getElementById("app");
  const PW_KEY = "qm_admin_pw";

  function getPw(){ return localStorage.getItem(PW_KEY) || ""; }

  async function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ "Content-Type":"application/json", "x-admin-password": getPw() }, opts.headers||{});
    const res = await fetch(path, opts);
    if (res.status === 401){ showLogin("Sirta waa qalad, fadlan isku day mar kale."); throw new Error("unauthorized"); }
    if (!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.error||"server error"); }
    return res.status === 204 ? null : res.json();
  }

  function showLogin(err){
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("appShell").style.display = "none";
    document.getElementById("loginErr").textContent = err || "";
  }
  function showApp(){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appShell").style.display = "block";
  }

  document.getElementById("loginBtn").addEventListener("click", async ()=>{
    const pw = document.getElementById("pwInput").value;
    try {
      const res = await fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password: pw}) });
      const j = await res.json();
      if (j.ok){ localStorage.setItem(PW_KEY, pw); showApp(); loadAll(); }
      else document.getElementById("loginErr").textContent = "Sirta waa qalad.";
    } catch(e){ document.getElementById("loginErr").textContent = "Khalad server ah."; }
  });
  document.getElementById("pwInput").addEventListener("keydown", e=>{ if (e.key==="Enter") document.getElementById("loginBtn").click(); });

  document.querySelectorAll("nav.tabs button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      activeTab = btn.dataset.tab;
      currentTeacherId = null;
      render();
    });
  });

  async function loadAll(){
    try {
      teachers = await api("/api/teachers");
      evaluations = await api("/api/evaluations");
      students = await api("/api/students");
      const subjRows = await api("/api/subjects");
      subjectCatalog = subjRows.map(s=>({ key: s.id, title: s.title }));
      sowTopics = await api("/api/sow/topics");
      sowSettings = await api("/api/sow/settings");
      render();
    } catch(e){ console.error(e); }
  }

  function logout(){
    localStorage.removeItem(PW_KEY);
    teachers = []; evaluations = []; students = []; subjectCatalog = []; sowTopics = []; sowSettings = {}; currentTeacherId = null; activeTab = "dashboard";
    document.querySelectorAll("nav.tabs button[data-tab]").forEach(b=>b.classList.remove("active"));
    document.querySelector('nav.tabs button[data-tab="dashboard"]').classList.add("active");
    showLogin();
  }
  document.getElementById("logoutBtn").addEventListener("click", logout);

  async function boot(){
    const pw = getPw();
    if (!pw){ showLogin(); return; }
    try {
      const res = await fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password: pw}) });
      const j = await res.json();
      if (j.ok){ showApp(); loadAll(); } else showLogin();
    } catch(e){ showLogin("Khalad xidhiidh server ah."); }
  }

  function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
  function overallLevel(pct){
    if (pct>=90) return "Heer Sare";
    if (pct>=70) return "Wanaagsan";
    if (pct>=50) return "La Aqbali Karo";
    if (pct>=30) return "U Baahan Horumarin";
    return "U Baahan Taageero Degdeg ah";
  }
  function scoreBadgeClass(pct){ if (pct>=70) return "good"; if (pct>=50) return "warn"; return "bad"; }
  function teacherEvals(id){ return evaluations.filter(e=>e.teacher_id===id).sort((a,b)=>new Date(a.date)-new Date(b.date)); }
  function teacherLatestScore(id){ const e=teacherEvals(id); return e.length? Number(e[e.length-1].score) : null; }
  function teacherOverallScore(id){ const e=teacherEvals(id); if(!e.length) return null; return e.reduce((a,x)=>a+Number(x.score),0)/e.length; }
  function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

  // ---------- Item-level comparison between two evaluations ----------
  function compareItems(prevEval, currEval){
    return CRITERIA.map(c=>{
      const p = (prevEval.items||[]).find(it=>it.key===c.key);
      const cur = (currEval.items||[]).find(it=>it.key===c.key);
      const pr = p ? Number(p.rating) : null;
      const cr = cur ? Number(cur.rating) : null;
      let status = "same";
      if (pr!==null && cr!==null){ if (cr>pr) status="up"; else if (cr<pr) status="down"; }
      return { key:c.key, title:c.title, prev:pr, curr:cr, delta:(pr!==null&&cr!==null)?cr-pr:null, status };
    });
  }
  function comparisonSummary(cmp){
    const up = cmp.filter(c=>c.status==="up").length;
    const down = cmp.filter(c=>c.status==="down").length;
    const same = cmp.filter(c=>c.status==="same").length;
    return { up, down, same };
  }
  function comparisonHtml(prevEval, currEval){
    const cmp = compareItems(prevEval, currEval);
    const s = comparisonSummary(cmp);
    let summaryText;
    if (s.up > s.down) summaryText = `📈 Guud ahaan macallinku wuxuu sameeyay HORUMAR — ${s.up} qodob ayaa kor u kacay, ${s.down} hoos u dhacay, ${s.same} isku mid ahaaday.`;
    else if (s.down > s.up) summaryText = `📉 Guud ahaan macallinku wuxuu sameeyay HOOS U DHAC — ${s.down} qodob ayaa hoos u dhacay, ${s.up} kor u kacay, ${s.same} isku mid ahaaday.`;
    else summaryText = `➖ Isbeddel weyn lama arag — ${s.up} kor u kacay, ${s.down} hoos u dhacay, ${s.same} isku mid ahaaday.`;

    const rows = cmp.map(c=>{
      let cls = "cmp-same", arrow = "▬", note = "Isku mid";
      if (c.status==="up"){ cls="cmp-up"; arrow="▲"; note=`Horumar (+${c.delta})`; }
      else if (c.status==="down"){ cls="cmp-down"; arrow="▼"; note=`Hoos u dhac (${c.delta})`; }
      return `<div class="cmp-row">
        <div class="cmp-title">${escapeHtml(c.title)}</div>
        <div class="cmp-vals ${cls}">${c.prev!==null?c.prev:"—"} → ${c.curr!==null?c.curr:"—"} ${arrow} <span style="font-weight:600;font-size:.72rem;">${note}</span></div>
      </div>`;
    }).join("");
    return `<div class="cmp-summary">${summaryText}</div>${rows}`;
  }

  async function addTeacher(name, subject){
    const t = await api("/api/teachers", { method:"POST", body: JSON.stringify({name, subject}) });
    await loadAll();
    return t;
  }
  async function addTeachersBulk(names){
    await api("/api/teachers/bulk", { method:"POST", body: JSON.stringify({names}) });
    await loadAll();
  }
  async function deleteTeacher(id){ await api("/api/teachers/"+id, { method:"DELETE" }); if (currentTeacherId===id) currentTeacherId=null; await loadAll(); }
  async function addEvaluation(teacherId, date, items, meta){
    return await api("/api/evaluations", { method:"POST", body: JSON.stringify({teacherId, date, items, meta}) });
  }

  function parseSowRows(raw){
    const lines = raw.split("\n").map(l=>l.replace(/\r$/,"")).filter(l=>l.trim());
    const rows = [];
    for (const line of lines){
      if (/week/i.test(line) && /(topic|lesson)/i.test(line)) continue; // header row
      let cols = line.split("\t");
      if (cols.length < 2) cols = line.split(",");
      cols = cols.map(c=>c.trim());
      let weekNo = null, topic;
      if (cols.length >= 2 && /^\d+$/.test(cols[0])){
        weekNo = Number(cols[0]);
        topic = cols.slice(1).join(" ").trim();
      } else {
        // Loosely-formatted lines (common when text comes from a PDF or Word file):
        // "Week 1: Topic", "Week 1 - Topic", "1. Topic", "1) Topic", "1 - Topic", "1   Topic"
        const trimmed = line.trim();
        const wkMatch = trimmed.match(/^(?:week|wk|toddobaad(?:ka)?)\s*#?\s*(\d{1,2})\s*[:\-.)]?\s+(.+)$/i);
        const numMatch = !wkMatch ? trimmed.match(/^(\d{1,2})\s*[-.):]?\s+(.+)$/) : null;
        if (wkMatch){ weekNo = Number(wkMatch[1]); topic = wkMatch[2].trim(); }
        else if (numMatch){ weekNo = Number(numMatch[1]); topic = numMatch[2].trim(); }
        else { topic = cols.join(" ").trim(); }
      }
      if (!topic) continue;
      rows.push({ weekNo, topic });
    }
    return rows;
  }
  function detectSowHeaderMap(row){
    if (!row) return null;
    const norm = row.map(c=>String(c==null?"":c).toLowerCase().trim());
    const find = (fragments)=>norm.findIndex(c=>fragments.some(f=>c.includes(f)));
    const topicIdx = find(["topic","lesson","content","subtopic"]);
    if (topicIdx===-1) return null;
    const weekIdx = find(["week","wk"]);
    return { week: weekIdx===-1?null:weekIdx, topic: topicIdx };
  }
  function rowsFromSowAoa(aoa){
    if (!aoa || !aoa.length) return [];

    for (let i=0;i<Math.min(aoa.length,5);i++){

      const weekNo = /^\d+$/.test(weekRaw) ? Number(weekRaw) : null;

  }
  // Load an external script only when actually needed (keeps normal page load light/fast).
  const _loadedScripts = {};
  function loadScriptOnce(url){
    if (_loadedScripts[url]) return _loadedScripts[url];
    _loadedScripts[url] = new Promise((resolve, reject)=>{
      const s = document.createElement("script");
      s.src = url;
      s.onload = ()=>resolve();
      s.onerror = ()=>{ delete _loadedScripts[url]; reject(new Error("Ma suurtageli in la soo shubo maktabadda ("+url+"). Hubi internetka.")); };
      document.head.appendChild(s);
    });
    return _loadedScripts[url];
  }

  // Extract text from a PDF by grouping text items into lines using their vertical position.
  function extractTextFromPdf(file){
    return new Promise(async (resolve, reject)=>{
      try {
        if (!window.pdfjsLib){
          await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
        }
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      } catch(e){ reject(new Error("Maktabadda PDF lama soo shubin. Hubi internetka.")); return; }
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error("Ma suurtageli in la akhriyo PDF-ka."));
      reader.onload = async ()=>{
        try {
          const data = new Uint8Array(reader.result);
          const pdf = await pdfjsLib.getDocument({ data }).promise;
          let fullText = "";
          for (let p=1;p<=pdf.numPages;p++){
            const page = await pdf.getPage(p);
            const content = await page.getTextContent();
            const byLine = {};
            content.items.forEach(it=>{
              const y = Math.round(it.transform[5]);
              if (!byLine[y]) byLine[y] = [];
              byLine[y].push({ str: it.str, x: it.transform[4] });
            });
            const ys = Object.keys(byLine).map(Number).sort((a,b)=>b-a); // top -> bottom
            ys.forEach(y=>{
              const line = byLine[y].sort((a,b)=>a.x-b.x).map(it=>it.str).join(" ").replace(/\s+/g," ").trim();
              if (line) fullText += line + "\n";
            });
          }
          resolve(fullText);
        } catch(e){ reject(new Error("Ma suurtageli in la akhriyo PDF-ka: " + (e && e.message ? e.message : e))); }
      };
      reader.readAsArrayBuffer(file);
    });
  }

  // Extract raw text from a Word (.docx) file.
  function extractTextFromDocx(file){
    return new Promise(async (resolve, reject)=>{
      try {
        if (!window.mammoth){
          await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js");
        }
      } catch(e){ reject(new Error("Maktabadda Word lama soo shubin. Hubi internetka.")); return; }
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error("Ma suurtageli in la akhriyo Word-ka."));
      reader.onload = async ()=>{
        try {
          const result = await mammoth.extractRawText({ arrayBuffer: reader.result });
          resolve(result && result.value ? result.value : "");
        } catch(e){ reject(new Error("Ma suurtageli in la akhriyo Word-ka: " + (e && e.message ? e.message : e))); }
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function extractSowRowsFromFile(file){
    const name = (file.name||"").toLowerCase();
    const isPdf = name.endsWith(".pdf") || file.type==="application/pdf";
    const isDocx = name.endsWith(".docx") || file.type==="application/vnd.openxmlformats-officedocument.wordprocessingml.document";
    const isDoc = name.endsWith(".doc") && !isDocx;
    if (isPdf) return extractTextFromPdf(file).then(text=>parseSowRows(text));
    if (isDoc) return Promise.reject(new Error("Qaabka .doc (Word-kii hore) lama taageerayo — kaydi file-ka sidii .docx kadibna isku day mar kale."));
    if (isDocx) return extractTextFromDocx(file).then(text=>parseSowRows(text));
    return new Promise((resolve, reject)=>{
      const isCsv = name.endsWith(".csv") || file.type==="text/csv";
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error("Ma suurtageli in la akhriyo file-ka."));
      if (isCsv){
        reader.onload = ()=>{ try { resolve(parseSowRows(String(reader.result||""))); } catch(e){ reject(e); } };
        reader.readAsText(file);
      } else {
        reader.onload = ()=>{
          try {
            if (!window.XLSX) throw new Error("Maktabadda XLSX lama soo shubin.");
            const data = new Uint8Array(reader.result);
            const wb = XLSX.read(data, {type:"array"});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
            resolve(rowsFromSowAoa(aoa));
          } catch(e){ reject(e); }
        };
        reader.readAsArrayBuffer(file);
      }
    });
  }

  function parseStudentRows(raw){

  }

  function splitClassSection(classSec){
    const m = String(classSec||"").match(/^(.*?)\s*\(([^)]+)\)\s*$/);
    if (m) return { className: m[1].trim(), section: m[2].trim() };
    return { className: String(classSec||"").trim(), section: "" };
  }

  function rowsFromSheetAoa(aoa){
    if (!aoa || !aoa.length) return [];

            ${meta.conclusion || meta.strengths || meta.improvements || meta.recommendations ? `<div class="notes-txt">📝 <a href="#" data-viewdetail="${e.id}" style="color:var(--accent);">Arag Gunaadka</a></div>` : ""}
            ${prevEval ? `<details><summary>📊 Isbarbardhigga qodob-qodobka (vs ${prevEval.date})</summary>${comparisonHtml(prevEval, e)}</details>` : ""}
          </div>`;
        }).join("")}
      </div>
      <div class="card">
        <button class="btn secondary" id="goEvalBtn">➕ Ku Dar Qiimeyn Cusub oo ${escapeHtml(t.name)} ah</button>
      </div>
    `;
    document.getElementById("backBtn").addEventListener("click", ()=>{ currentTeacherId=null; render(); });
    document.getElementById("copyLinkBtn").addEventListener("click", ()=>{
      navigator.clipboard.writeText(link).then(()=>{
        const b = document.getElementById("copyLinkBtn"); b.textContent="La koobiyay ✓"; setTimeout(()=>b.textContent="Koobi",1500);
      });
    });
    document.getElementById("goEvalBtn").addEventListener("click", ()=>{
      document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
      document.querySelector('nav.tabs button[data-tab="newEval"]').classList.add("active");
      activeTab = "newEval"; preselectTeacher = teacherId; render();
    });
    app.querySelectorAll("[data-delev]").forEach(el=>{
      el.addEventListener("click", async ()=>{ if (confirm("Ma hubtaa inaad tirtirto qiimeyntan?")) await deleteEvaluation(el.dataset.delev); });
    });
    app.querySelectorAll("[data-viewdetail]").forEach(el=>{
      el.addEventListener("click", (ev)=>{
        ev.preventDefault();
        const evalId = el.dataset.viewdetail;
        const evalObj = evs.find(x=>x.id===evalId);
        if (!evalObj) return;
        const m = evalObj.meta || {};
        let msg = `Qiimeynta ${evalObj.date}:\n\n`;
        if (m.conclusion) msg += `GUNAAD:\n${m.conclusion}\n\n`;
        if (m.strengths) msg += `WANAAGSAN:\n${m.strengths}\n\n`;
        if (m.improvements) msg += `U BAAHAN HORUMARIN:\n${m.improvements}\n\n`;
        if (m.recommendations) msg += `TALOOYINKA KORMEERAHA:\n${m.recommendations}\n\n`;
        alert(msg || "Faallo lama gelin.");
      });
    });

    if (evs.length>=2 && window.Chart){
      const ctx = document.getElementById("teacherChart");
      if (chartInstance){ chartInstance.destroy(); chartInstance=null; }
      const cssVal = getComputedStyle(document.documentElement);
      const textColor = cssVal.getPropertyValue('--text').trim()||'#333';
      const gridColor = cssVal.getPropertyValue('--border').trim()||'#ddd';
      chartInstance = new Chart(ctx, {
        type:"line",
        data:{
          labels: evs.map(e=>e.date),
          datasets: [
            { label:"Celceliska Guud (%)", data: evs.map(e=>Number(e.score)), borderColor:"#0d1b5e", backgroundColor:"#0d1b5e", tension:.3, pointRadius:4, borderWidth:2 }
          ]
        },
        options:{ responsive:true, maintainAspectRatio:false,
          scales:{ y:{min:0,max:100,ticks:{color:textColor,stepSize:20},grid:{color:gridColor}}, x:{ticks:{color:textColor},grid:{color:gridColor}} },
          plugins:{ legend:{labels:{color:textColor,boxWidth:10,font:{size:10}}} } }
      });
    }
  }

  function renderAssignSubjects(body){
    if (!students.length){
      body.innerHTML = `<div class="card"><div class="empty">Wali arday lama gelin. Tag "➕ Ku Dar / Maarayn Ardayda" si aad ardayda ugu darto.</div></div>`;

    const searchInput = document.getElementById("studentSearchInput");

    function renderSearchResults(){
      const q = studentSearchQuery.trim().toLowerCase();
      if (!q){ resultsBox.innerHTML = ""; return; }
      const matches = students.filter(s=>s.name.toLowerCase().includes(q) || (s.adm_no||"").toLowerCase().includes(q)).slice(0,20);
      resultsBox.innerHTML = matches.length ? matches.map(s=>{
        const held = (s.subjects||[]).length;
        return `<div class="student-row" data-search-open="${s.id}">
          <div><div class="name">${escapeHtml(s.name)}</div><div class="sub">${escapeHtml(s.adm_no||"")} · ${escapeHtml(s.class_name)}${s.section?` (${escapeHtml(s.section)})`:""}</div></div>
          <span class="badge ${held===subjectCatalog.length?'good':held===0?'bad':'warn'}">${held}/${subjectCatalog.length} maado</span>
        </div>`;
      }).join("") : `<div class="empty">Wax arday ah lama helin.</div>`;
      resultsBox.querySelectorAll("[data-search-open]").forEach(el=>{
        el.addEventListener("click", ()=>{
          assignStudentId = el.dataset.searchOpen;
          assignSelected = [];
          studentSearchQuery = "";
          searchInput.value = "";
          resultsBox.innerHTML = "";
          renderSubjectPanel();
        });
      });
    }
    searchInput.addEventListener("input", (e)=>{ studentSearchQuery = e.target.value; renderSearchResults(); });
    renderSearchResults();

    if (assignStudentId && students.some(s=>s.id===assignStudentId)) renderSubjectPanel();

    function renderSubjectPanel(){
      const st = students.find(x=>x.id===assignStudentId);
      const panel = document.getElementById("subjectPanel");
      if (!st){ panel.innerHTML=""; return; }
      const held = st.subjects||[];
      const missing = subjectCatalog.filter(sub=>!held.includes(sub.key));
      panel.innerHTML = `
        <div class="card">
          <h2>Maadooyinka — ${escapeHtml(st.name)}</h2>
          <div class="sub" style="color:var(--text-dim);font-size:.8rem;margin-bottom:10px;">${escapeHtml(st.adm_no||"")} · ${escapeHtml(st.class_name)}${st.section?` (${escapeHtml(st.section)})`:""} · Haysta ${held.length}/${subjectCatalog.length} maado</div>
          ${missing.length===0 ? `<div class="empty">✅ Ardaygan wuxuu haystaa dhammaan ${subjectCatalog.length}-da maado.</div>` : `
          <label>Maadooyinka Kamaqan (tick kuwa uu hadda qaadanayo)</label>
          <div class="subj-grid">
            ${missing.map(sub=>`<button class="subj-chip ${assignSelected.includes(sub.key)?'sel':''}" data-subj="${sub.key}">${assignSelected.includes(sub.key)?'✓ ':''}${escapeHtml(sub.title)}</button>`).join("")}
          </div>
          <button class="btn" id="btnSaveSubjects">💾 Kaydi Maadooyinka</button>
          <button class="btn secondary" id="btnAllSubjects">☑️ Dooro Dhammaan</button>
          `}
          <button class="btn secondary" id="btnCloseStudent">✕ Xir</button>
        </div>
      `;
      if (missing.length){
        panel.querySelectorAll("[data-subj]").forEach(b=>{
          b.addEventListener("click", ()=>{
            const key = b.dataset.subj;
            if (assignSelected.includes(key)) assignSelected = assignSelected.filter(k=>k!==key);
            else assignSelected.push(key);
            renderSubjectPanel();
          });
        });
        document.getElementById("btnAllSubjects").addEventListener("click", ()=>{ assignSelected = missing.map(s=>s.key); renderSubjectPanel(); });
        document.getElementById("btnSaveSubjects").addEventListener("click", async ()=>{
          const btn = document.getElementById("btnSaveSubjects"); btn.disabled=true; btn.textContent="Kaydinaya...";
          try {
            const merged = Array.from(new Set([...(st.subjects||[]), ...assignSelected]));
            assignSelected = [];
            await updateStudentSubjects(st.id, merged);
          } finally { btn.disabled=false; btn.textContent="💾 Kaydi Maadooyinka"; }
        });
      }
      document.getElementById("btnCloseStudent").addEventListener("click", ()=>{ assignStudentId=null; assignSelected=[]; render(); });
    }
  }

  function renderClassReport(body){

      return;
    }
    if (!reportClass || !classes.includes(reportClass)) reportClass = classes[0];

    if (reportSection !== "__ALL__" && !sections.includes(reportSection)) reportSection = "__ALL__";

    body.innerHTML = `
      <div class="card no-print">
        <h2>Warbixinta Maadooyinka — Dooro Fasalka</h2>
        <label>Fasalka</label>
        <select id="repClassSel">${classes.map(c=>`<option value="${escapeHtml(c)}" ${c===reportClass?"selected":""}>${escapeHtml(c)}</option>`).join("")}</select>
        <label>Qaybta</label>
        <select id="repSectionSel">
          <option value="__ALL__" ${reportSection==="__ALL__"?"selected":""}>Dhammaan Qaybaha</option>
          ${sections.map(s=>`<option value="${escapeHtml(s)}" ${s===reportSection?"selected":""}>${escapeHtml(s)}</option>`).join("")}
        </select>
        <button class="btn gold" id="printReportBtn">🖨️ Daabac Warbixinta</button>
      </div>
      <div id="reportArea"></div>
    `;

    document.getElementById("repSectionSel").addEventListener("change", (e)=>{ reportSection=e.target.value; render(); });
    document.getElementById("printReportBtn").addEventListener("click", ()=>window.print());

    const list = students.filter(s=>s.class_name===reportClass && (reportSection==="__ALL__" || (s.section||"")===reportSection))
      .slice().sort((a,b)=>(a.section||"").localeCompare(b.section||"") || a.name.localeCompare(b.name));

    const area = document.getElementById("reportArea");
    if (!list.length){ area.innerHTML = `<div class="empty">Qaybtan arday kuma jiraan.</div>`; return; }

    const rows = list.map((s,i)=>{
      const held = s.subjects||[];
      const missing = subjectCatalog.filter(sub=>!held.includes(sub.key)).map(sub=>sub.title);
      const cells = subjectCatalog.map(sub=>`<td>${held.includes(sub.key)?'<span class="yes">✓</span>':'<span class="no">✗</span>'}</td>`).join("");
      return `<tr>
        <td>${i+1}</td>
        <td class="namecell">${escapeHtml(s.adm_no||"")}</td>

        <td class="namecell" style="max-width:180px;">${missing.length ? escapeHtml(missing.join(", ")) : "—"}</td>
      </tr>`;
    }).join("");

    const totalHeld = list.reduce((a,s)=>a+((s.subjects||[]).length),0);
    const avg = (totalHeld/list.length).toFixed(1);
    const complete = list.filter(s=>(s.subjects||[]).length===subjectCatalog.length).length;

    area.innerHTML = `
      <div class="report-header">
        <img src="/logo.jpg" alt="logo">
        <div>
          <h2 style="margin:0;">Dugsiga Howlwadaag Sare</h2>
          <div style="font-size:.85rem;color:#555;">Warbixinta Maadooyinka Ardayda — ${escapeHtml(reportClass)}${reportSection!=="__ALL__"?` (${escapeHtml(reportSection)})`:""}</div>
        </div>
      </div>
      <p style="font-size:.85rem;">Wadarta ardayda: <b>${list.length}</b> · Celceliska maadooyinka qofkiiba: <b>${avg}</b> · Ku dhammaystiray ${subjectCatalog.length}-da maado: <b>${complete}</b></p>
      <div style="overflow-x:auto;">
      <table class="subj-table">
        <thead><tr>
          <th>#</th><th class="namecell">Adm No</th><th class="namecell">Magaca</th>
          ${subjectCatalog.map(sub=>`<th title="${escapeHtml(sub.title)}">${escapeHtml(sub.title.slice(0,3))}</th>`).join("")}
          <th class="namecell">Maadooyinka Kamaqan</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    `;
  }

        <div>
          <h2 style="margin:0;">Dugsiga Howlwadaag Sare</h2>
          <div style="font-size:.85rem;color:#555;">Warbixinta Ardayda Dhammaystay Dhammaan ${total}-da Maado${completeReportClass!=="__ALL__"?` — ${escapeHtml(completeReportClass)}${completeReportSection!=="__ALL__"?` (${escapeHtml(completeReportSection)})`:""}`:""}</div>
        </div>
      </div>
      <p style="font-size:.85rem;">Wadarta ardayda dhammaystay: <b>${list_sorted.length}</b> / ${pool.length}</p>
      <div style="overflow-x:auto;">
      <table class="subj-table">
        <thead><tr>
          <th>#</th><th class="namecell">Adm No</th><th class="namecell">Magaca</th><th class="namecell">Fasalka</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    `;

  // ---------- Scheme of Work: report by subject + lesson title ----------
  function normalizeTopicText(s){
    return String(s||"")
      .toLowerCase()
      .normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9\s]/g," ")
      .replace(/\s+/g," ")
      .trim();
  }
  function findSowTopicMatches(subjectKey, query){
    const q = normalizeTopicText(query);
    if (!q) return [];
    const qWords = new Set(q.split(" ").filter(Boolean));
    const candidates = sowTopics.filter(t=>t.subject_key===subjectKey);
    const scored = candidates.map(t=>{
      const norm = normalizeTopicText(t.topic);
      let score = 0;
      if (norm === q) score = 100;
      else if (norm.includes(q) || q.includes(norm)) score = 80;
      else {
        const words = new Set(norm.split(" ").filter(Boolean));
        let common = 0;
        qWords.forEach(w=>{ if (words.has(w)) common++; });
        score = qWords.size ? Math.round((common/qWords.size)*60) : 0;
      }
      return { t, score };
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    return scored;
  }

  function renderSowLookupReport(subjectKey, title){
    const out = document.getElementById("sowLookupResult");
    const subjTitle = (subjectCatalog.find(s=>s.key===subjectKey)||{}).title || "";
    if (!title || !title.trim()){
      out.innerHTML = `<div class="card"><div class="empty">Fadlan qor cinwaanka casharka.</div></div>`;
      return;
    }
    const matches = findSowTopicMatches(subjectKey, title);
    if (!matches.length){
      const allTopics = sowTopics.filter(t=>t.subject_key===subjectKey);
      out.innerHTML = `
        <div class="card">
          <div class="compare-note pending">⚠️ Cinwaanka "<b>${escapeHtml(title.trim())}</b>" lagama helin Scheme of Work-ka maadada <b>${escapeHtml(subjTitle)}</b>.</div>
          <p style="font-size:.8rem;color:var(--text-dim);margin-top:10px;">
            ${allTopics.length
              ? `Hubi in qoraalku la mid yahay ama u dhow yahay sida Scheme of Work-ka loogu qoray, ama tag "📤 Soo Deji Scheme" si aad u eegto liiska casharada maadadan.`
              : `Wali Scheme of Work looma gelin maadada "${escapeHtml(subjTitle)}". Tag "📤 Soo Deji Scheme" si aad u geliso.`}
          </p>
        </div>`;
      return;
    }
    const week = currentWeekNo();
    // Keep only the best-scoring match per class (a subject can have more than one class).
    const byClass = {};
    matches.forEach(({t,score})=>{
      const key = t.class_name;
      if (!byClass[key] || byClass[key].score < score) byClass[key] = { t, score };
    });
    const rows = Object.values(byClass).sort((a,b)=>a.t.class_name.localeCompare(b.t.class_name));
    out.innerHTML = rows.map(({t,score})=>{
      let statusHtml;
      if (t.done){
        statusHtml = `<div class="compare-note ok">✅ Casharkan horeyba waa la dhammeeyay${t.week_no!=null?` (loo qorsheeyay Toddobaad ${t.week_no})`:""}.</div>`;
      } else if (week==null){
        statusHtml = `<div class="compare-note pending">⏳ Lama xisaabin karo xaaladda — wali lama dejin taariikhda bilowga semester-ka.</div>`;
      } else if (t.week_no==null){
        statusHtml = `<div class="compare-note pending">ℹ️ Casharkan toddobaad looma qorin Scheme of Work-ka, sidaa darteed lagama xisaabin karo in la dib dhacay iyo in kale.</div>`;
      } else if (t.week_no < week){
        const diff = week - t.week_no;
        statusHtml = `<div class="compare-note pending">⚠️ Waad ka dib dhacsan tahay — casharkan waxaa loo qorsheeyay Toddobaad <b>${t.week_no}</b>, waxaadna haatan joogtaa Toddobaadka <b>${week}</b> (${diff} toddobaad oo dib dhac ah).</div>`;
      } else if (t.week_no === week){
        statusHtml = `<div class="compare-note ok">✅ Waad la socotaa jadwalka — casharkan waxaa loo qorsheeyay toddobaadkan (Toddobaad ${week}).</div>`;
      } else {
        const diff = t.week_no - week;
        statusHtml = `<div class="compare-note ok">🟢 Waad ka hor martay jadwalka — casharkan waxaa loo qorsheeyay Toddobaad <b>${t.week_no}</b> (${diff} toddobaad oo mustaqbal ah), waxaadna haatan joogtaa Toddobaadka <b>${week}</b>.</div>`;
      }
      return `
        <div class="card">
          <h2>${escapeHtml(subjTitle)} — ${escapeHtml(t.class_name)}</h2>
          <p style="font-size:.85rem;margin:0 0 6px;">
            Cinwaanka la helay: <b>${escapeHtml(t.topic)}</b>
            ${t.week_no!=null?` &nbsp;·&nbsp; Toddobaadka Qorshaysan: <b>${t.week_no}</b>`:""}
            ${week!=null?` &nbsp;·&nbsp; Toddobaadka Hadda: <b>${week}</b>`:""}
          </p>
          ${score<80 ? `<p style="font-size:.75rem;color:var(--text-dim);">(Isku ekaanshaha qoraalka ma aha 100% — hubi in ay tahay casharka saxda ah.)</p>` : ""}
          ${statusHtml}
        </div>`;
    }).join("");
  }

          <option value="">— Dooro —</option>
          ${teachers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(t=>`<option value="${t.id}" data-subject="${escapeHtml(t.subject||"")}" ${preselectTeacher===t.id?"selected":""}>${escapeHtml(t.name)}${t.subject?" — "+escapeHtml(t.subject):""}</option>`).join("")}
        </select>
        <label>Maadada</label>
        <select id="evalSubjectSel">

        </div>

    const teacherSel = document.getElementById("evalTeacherSel");
    const subjectSel = document.getElementById("evalSubjectSel");
    const subjectOther = document.getElementById("evalSubjectOther");
    teacherSel.addEventListener("change", ()=>{
      const opt = teacherSel.options[teacherSel.selectedIndex];
      const subj = opt ? opt.dataset.subject : "";
      if (subj && Array.from(subjectSel.options).some(o=>o.value===subj)){
        subjectSel.value = subj; subjectOther.style.display = "none";
      }
    });
    subjectSel.addEventListener("change", ()=>{
      subjectOther.style.display = subjectSel.value === "__other__" ? "block" : "none";
    });
    if (preselectTeacher){
      const opt = Array.from(teacherSel.options).find(o=>o.value===preselectTeacher);
      const subj = opt ? opt.dataset.subject : "";
      if (subj && Array.from(subjectSel.options).some(o=>o.value===subj)) subjectSel.value = subj;
    }

    const wrap = document.getElementById("itemsWrap");
    CRITERIA.forEach(c=>{
      const div = document.createElement("div");
      div.className = "qitem";
      div.innerHTML = `
        <div class="qitem-title">${c.title}</div>
        <div class="qitem-text">${escapeHtml(c.text)}</div>
        <div class="rate-row">
          <button class="rate-btn" data-r="5" data-item="${c.key}">5</button>
          <button class="rate-btn" data-r="4" data-item="${c.key}">4</button>
          <button class="rate-btn" data-r="3" data-item="${c.key}">3</button>
          <button class="rate-btn" data-r="2" data-item="${c.key}">2</button>
          <button class="rate-btn" data-r="1" data-item="${c.key}">1</button>
        </div>
        <input type="text" class="qitem-comment" data-comment="${c.key}" placeholder="Comment/Faallo (ikhtiyaari)">
      `;
      wrap.appendChild(div);
    });

    function updateProgress(){
      let done = 0;
      Object.values(evalState).forEach(v=>{ if (v.rating!==null) done++; });
      document.getElementById("progressCount").textContent = done;
      document.getElementById("progressBar").style.width = Math.round((done/TOTAL_ITEMS)*100)+"%";
      const saveBtn = document.getElementById("saveEvalBtn");
      if (done === TOTAL_ITEMS){
        saveBtn.disabled = false;
        saveBtn.textContent = "💾 Kaydi Qiimeynta";
      } else {
        saveBtn.disabled = true;
        saveBtn.textContent = `💾 Kaydi Qiimeynta (${TOTAL_ITEMS-done} baaqi)`;
      }
    }

    wrap.querySelectorAll(".rate-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const key = btn.dataset.item;
        const r = Number(btn.dataset.r);
        evalState[key].rating = r;
        wrap.querySelectorAll(`.rate-btn[data-item="${key}"]`).forEach(b=>b.classList.remove("sel"));
        btn.classList.add("sel");
        updateProgress();
      });
    });
    wrap.querySelectorAll(".qitem-comment").forEach(inp=>{
      inp.addEventListener("input", ()=>{
        const key = inp.dataset.comment;
        evalState[key].comment = inp.value;
      });
    });

    document.getElementById("saveEvalBtn").addEventListener("click", async ()=>{
      const teacherId = document.getElementById("evalTeacherSel").value;
      const date = document.getElementById("evalDate").value;
      if (!teacherId){ alert("Fadlan dooro macallin."); return; }
      if (!date){ alert("Fadlan geli taariikhda."); return; }
      const items = CRITERIA.map(c=>({ key:c.key, title:c.title, text:c.text, rating:evalState[c.key].rating, comment:evalState[c.key].comment }));
      const subjSelVal = document.getElementById("evalSubjectSel").value;
      const subject = subjSelVal === "__other__" ? document.getElementById("evalSubjectOther").value : subjSelVal;
      const meta = {
        school: document.getElementById("evalSchool").value,
        class: document.getElementById("evalClass").value,
        subject: subject,
        supervisorName: document.getElementById("evalSupervisor").value,
        conclusion: document.getElementById("evalConclusion").value
      };
      const btn = document.getElementById("saveEvalBtn"); btn.disabled=true; btn.textContent="Kaydinaya...";
      try {
        await addEvaluation(teacherId, date, items, meta);
        preselectTeacher = null; currentTeacherId = teacherId;
        await loadAll();
        document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
        document.querySelector('nav.tabs button[data-tab="teachers"]').classList.add("active");
        activeTab = "teachers"; render();
      } catch(e){ alert("Khalad ayaa dhacay: "+e.message); btn.disabled=false; btn.textContent="💾 Kaydi Qiimeynta"; }
    });

    updateProgress();
  }
