<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xogtayda — Qiimeynta</title>
<style>
  :root {
    --bg:#f4f6f8; --surface:#fff; --surface-2:#eef1f4; --text:#1c2530; --text-dim:#5b6b7a;
    --border:#dde3e9; --primary:#1e6f5c; --primary-dark:#14503f;
    --good:#1e8e5a; --warn:#c98a13; --bad:#c0392b;
    --shadow:0 1px 3px rgba(20,30,40,.08),0 1px 2px rgba(20,30,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171c; --surface:#1a2128; --surface-2:#212a32; --text:#e7edf2; --text-dim:#93a3b1;
      --border:#2a343d; --primary:#3fae8f; --primary-dark:#2c8168;
      --good:#3fae7a; --warn:#e0ac3f; --bad:#e0685b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; font-size:15px; }
  header { padding:18px 16px; background:linear-gradient(135deg,var(--primary-dark),var(--primary)); color:#fff; }
  header h1 { margin:0 0 2px; font-size:1.15rem; }
  header p { margin:0; font-size:.8rem; opacity:.85; }
  main { padding:14px; max-width:700px; margin:0 auto; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 4px; font-size:1.1rem; }
  .sub { color:var(--text-dim); font-size:.85rem; margin-bottom:10px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:.85rem; font-weight:700; color:#fff; }
  .badge.good { background:var(--good); } .badge.warn { background:var(--warn); } .badge.bad { background:var(--bad); } .badge.neutral { background:var(--text-dim); }
  .compare-note { font-size:.85rem; padding:10px 12px; border-radius:10px; margin-top:12px; }
  .compare-note.ok { background:rgba(30,142,90,.12); color:var(--good); }
  .compare-note.pending { background:rgba(201,138,19,.12); color:var(--warn); }
  .chart-wrap { position:relative; height:240px; margin-top:14px; }
  .eval-item { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--surface-2); }
  .eval-item .row1 { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .mini-scores { display:flex; gap:10px; flex-wrap:wrap; font-size:.8rem; color:var(--text-dim); }
  .mini-scores b { color:var(--text); }
  .notes-txt { font-size:.83rem; color:var(--text-dim); margin-top:6px; white-space:pre-wrap; }
  .empty, .loading { text-align:center; padding:40px 10px; color:var(--text-dim); }
  .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center; box-shadow:var(--shadow); }
  .stat .num { font-size:1.5rem; font-weight:800; color:var(--primary); }
  .stat .lbl { font-size:.72rem; color:var(--text-dim); }
</style>
</head>
<body>
<header>
  <h1>👋 Xogtayda ee Qiimeynta</h1>
  <p>Halkan waxaad ka arki kartaa horumarkaaga kormeerka</p>
</header>
<main id="app"><div class="loading">Soo dejinaya...</div></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(function(){
  "use strict";
  const CRITERIA = [
    { key:"prep", label:"Cashardiyaarinta", color:"#2f7fd1" },
    { key:"classroom", label:"Maareynta Fasalka", color:"#1e6f5c" },
    { key:"assessment", label:"Qiimeynta Ardayda", color:"#c98a13" }
  ];

  function avgOf(ev){ return (Number(ev.prep||0)+Number(ev.classroom||0)+Number(ev.assessment||0))/3; }
  function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
  function scoreBadgeClass(avg){ if (avg>=8) return "good"; if (avg>=6) return "warn"; return "bad"; }
  function scoreLabel(avg){ if (avg>=8) return "Wanaagsan"; if (avg>=6) return "Dhexdhexaad"; return "U baahan taageero"; }
  function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

  const app = document.getElementById("app");
  const token = window.location.pathname.split("/").filter(Boolean).pop();

  async function load(){
    try {
      const res = await fetch("/api/public/" + encodeURIComponent(token));
      if (!res.ok){
        app.innerHTML = `<div class="card"><div class="empty">⚠️ Link-gan sax ma aha ama waa la tirtiray. La xiriir xafiiska waxbarashada.</div></div>`;
        return;
      }
      const data = await res.json();
      render(data.teacher, data.evaluations);
    } catch(e){
      app.innerHTML = `<div class="card"><div class="empty">⚠️ Khalad ayaa dhacay. Isku day mar kale.</div></div>`;
    }
  }

  function render(teacher, evs){
    evs = evs.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
    const overall = evs.length ? evs.reduce((a,e)=>a+avgOf(e),0)/evs.length : null;
    const latest = evs.length ? avgOf(evs[evs.length-1]) : null;

    app.innerHTML = `
      <div class="card">
        <h2>${escapeHtml(teacher.name)}</h2>
        <div class="sub">${escapeHtml(teacher.subject||"")}</div>
        ${overall!==null ? `<span class="badge ${scoreBadgeClass(overall)}">Celceliska Guud: ${fmt1(overall)}/10 · ${scoreLabel(overall)}</span>` : `<span class="badge neutral">Wali lama qiimeyn</span>`}
        ${evs.length<3 ? `<div class="compare-note pending">📌 Waxaad heysaa ${evs.length} qiimeyn. Ugu yaraan 3 ayaa loo baahan yahay si aad si buuxda u aragto isbarbardhigga horumarkaaga.</div>` :
          `<div class="compare-note ok">✅ ${evs.length} qiimeyn ayaad heysaa — jaantuska hoose wuxuu kuu tusayaa horumarkaaga.</div>`}
      </div>

      ${evs.length ? `
      <div class="stat-grid">
        <div class="stat"><div class="num">${evs.length}</div><div class="lbl">Tirada Qiimeymaha</div></div>
        <div class="stat"><div class="num">${latest!==null?fmt1(latest):"—"}</div><div class="lbl">Qiimeyntii Ugu Dambeysay /10</div></div>
      </div>` : ""}

      ${evs.length>=2 ? `<div class="card"><h2>Horumarkaaga</h2><div class="chart-wrap"><canvas id="chart"></canvas></div></div>` : ""}

      <div class="card">
        <h2>Taariikhda Qiimeymaha</h2>
        ${evs.length===0 ? `<div class="empty">Wali lama kuu qiimeynin.</div>` :
        evs.slice().reverse().map(e=>{
          const a = avgOf(e);
          return `<div class="eval-item">
            <div class="row1"><span style="font-weight:700;font-size:.85rem;">${e.date}</span><span class="badge ${scoreBadgeClass(a)}">${fmt1(a)}/10</span></div>
            <div class="mini-scores">
              <span>${CRITERIA[0].label}: <b>${e.prep}</b>/10</span>
              <span>${CRITERIA[1].label}: <b>${e.classroom}</b>/10</span>
              <span>${CRITERIA[2].label}: <b>${e.assessment}</b>/10</span>
            </div>
            ${e.notes ? `<div class="notes-txt">📝 ${escapeHtml(e.notes)}</div>` : ""}
          </div>`;
        }).join("")}
      </div>
    `;

    if (evs.length>=2 && window.Chart){
      const ctx = document.getElementById("chart");
      const cssVal = getComputedStyle(document.documentElement);
      const textColor = cssVal.getPropertyValue('--text').trim()||'#333';
      const gridColor = cssVal.getPropertyValue('--border').trim()||'#ddd';
      new Chart(ctx, {
        type:"line",
        data:{ labels: evs.map(e=>e.date), datasets: CRITERIA.map(c=>({label:c.label,data:evs.map(e=>Number(e[c.key])),borderColor:c.color,backgroundColor:c.color,tension:.3,pointRadius:4})) },
        options:{ responsive:true, maintainAspectRatio:false,
          scales:{ y:{min:0,max:10,ticks:{color:textColor,stepSize:2},grid:{color:gridColor}}, x:{ticks:{color:textColor},grid:{color:gridColor}} },
          plugins:{ legend:{labels:{color:textColor,boxWidth:12,font:{size:10}}} } }
      });
    }
  }

  load();
})();
</script>
</body>
</html>
